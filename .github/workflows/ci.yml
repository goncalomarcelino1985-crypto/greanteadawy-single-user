name: CI
on:
  push:
    branches: [main, feature/cloud-persistence]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # This validation branch creates no retained cache or billed artifacts.
          cache: ${{ github.ref == 'refs/heads/main' && 'npm' || '' }}
      # ffmpeg: the export tests convert to every format (they skip the real-ffmpeg part without it)
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure() && github.ref == 'refs/heads/main'
        with:
          name: playwright-traces
          path: test-results/

  cloud-storage:
    # Standard runner in this public repository: synthetic fixtures only.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gm_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: gm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gm_test -d gm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GM_TEST_CLOUD_ALLOW_WRITE: 'true'
      GM_TEST_PG_URL: postgres://gm_test:synthetic-ci-only@127.0.0.1:5432/gm_test
      GM_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      GM_TEST_S3_BUCKET: gm-synthetic-test
      GM_TEST_S3_ACCESS_KEY_ID: gm-ci-test
      GM_TEST_S3_SECRET_ACCESS_KEY: synthetic-ci-only
      GM_TEST_S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Start isolated object storage
        run: |
          # Official SeaweedFS 4.38 image; pin the verified public multi-platform manifest.
          docker run -d --name gm-s3 -p 127.0.0.1:9000:8333 \
            -e AWS_ACCESS_KEY_ID=gm-ci-test -e AWS_SECRET_ACCESS_KEY=synthetic-ci-only \
            -e S3_BUCKET=gm-synthetic-test \
            chrislusf/seaweedfs@sha256:e1ee85a3089d96c4f3df699a0944468557813f5df306819c9d368c4039070ddf \
            mini -dir=/data -webdav=false -admin.ui=false -s3.port.iceberg=0 -master.telemetry=false
          node --input-type=module <<'JS'
          import { S3Client, HeadBucketCommand } from '@aws-sdk/client-s3';
          import { setTimeout } from 'node:timers/promises';
          const client = new S3Client({endpoint:process.env.GM_TEST_S3_ENDPOINT, region:'us-east-1', forcePathStyle:true, maxAttempts:1, credentials:{accessKeyId:process.env.GM_TEST_S3_ACCESS_KEY_ID,secretAccessKey:process.env.GM_TEST_S3_SECRET_ACCESS_KEY}});
          try {
            let ready = false;
            for (let attempt = 0; attempt < 60; attempt++) {
              try {
                await client.send(new HeadBucketCommand({Bucket:process.env.GM_TEST_S3_BUCKET}), {abortSignal:AbortSignal.timeout(2000)});
                ready = true;
                break;
              } catch {
                await setTimeout(1000);
              }
            }
            if (!ready) throw new Error('Isolated S3 fixture did not become ready with authenticated bucket access');
          } finally {
            client.destroy();
          }
          JS
      - name: Prove database, object, backup and fresh restore integration
        run: node --test --test-timeout=120000 server/test/cloud-repository.test.js server/test/cloud-server.test.js server/test/cloud-access.test.js

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t greanteadawy:ci .
      # start it hardened like docker-compose.yml and wait for the health check
      - run: |
          docker run -d --name gtd -p 127.0.0.1:3001:3001 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -e PUBLIC_URL=http://localhost:3001 greanteadawy:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' gtd)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' gtd | grep -q healthy
          curl -fsS http://localhost:3001/api/health
          docker exec gtd ffmpeg -hide_banner -encoders | grep -q libmp3lame
          docker logs gtd | grep -q "Setup code"
